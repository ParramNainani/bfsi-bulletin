<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef6ff"/>
      <stop offset="1" stop-color="#fbfdff"/>
    </linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9" stop-opacity=".22"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity=".16"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="960" height="540" rx="40" fill="url(#bg)"/>
  <circle cx="220" cy="90" r="130" fill="url(#b)" filter="url(#soft)"/>
  <circle cx="860" cy="260" r="180" fill="url(#b)" filter="url(#soft)" opacity=".75"/>

  <g transform="translate(150 140)">
    <rect x="0" y="0" width="520" height="300" rx="34" fill="#ffffff" fill-opacity=".86" stroke="#0b1220" stroke-opacity=".10"/>
    <g fill="none" stroke="#0b1220" stroke-opacity=".14" stroke-width="2">
      <path d="M0 70h520"/>
      <path d="M60 0v300"/>
      <path d="M160 0v300"/>
      <path d="M260 0v300"/>
      <path d="M360 0v300"/>
      <path d="M460 0v300"/>
    </g>
    <g>
      <rect x="86" y="98" width="120" height="46" rx="16" fill="#2563eb" fill-opacity=".10" stroke="#2563eb" stroke-opacity=".22"/>
      <rect x="86" y="164" width="190" height="46" rx="16" fill="#0ea5e9" fill-opacity=".10" stroke="#0ea5e9" stroke-opacity=".20"/>
      <rect x="86" y="230" width="150" height="46" rx="16" fill="#2563eb" fill-opacity=".08" stroke="#2563eb" stroke-opacity=".18"/>
    </g>
  </g>

  <g transform="translate(700 140)">
    <rect x="0" y="0" width="160" height="160" rx="30" fill="#ffffff" fill-opacity=".86" stroke="#0b1220" stroke-opacity=".10"/>
    <path d="M52 64h56" stroke="#0b1220" stroke-opacity=".20" stroke-width="10" stroke-linecap="round"/>
    <path d="M60 92h40" stroke="#2563eb" stroke-opacity=".85" stroke-width="10" stroke-linecap="round"/>
    <path d="M70 120h20" stroke="#0ea5e9" stroke-opacity=".75" stroke-width="10" stroke-linecap="round"/>
